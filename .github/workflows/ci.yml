name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint is temporarily disabled until a flat ESLint config is added.
      # `next lint` requires eslint.config.* with ESLint 9; the workspace uses
      # the legacy @pm-operator/eslint-config package. Typecheck + build below
      # still enforce type safety.
      # - name: Lint
      #   run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: ci
    # Runs against a throwaway Postgres in the runner — never against a real
    # Supabase project. TEST_DB_ONLY=1 makes the test helpers skip GoTrue.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MCP unit tests
        run: pnpm --filter @pm-operator/mcp test

      - name: Bootstrap Supabase shim
        run: psql "$DATABASE_URL" -f packages/db/supabase-shim.sql

      - name: Run migrations
        run: pnpm --filter @pm-operator/db db:migrate

      - name: Run web unit tests
        env:
          TEST_DB_ONLY: "1"
        run: pnpm test:unit

  e2e:
    name: E2E (test Supabase project)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Uses the dedicated test Supabase project — never production. The app is
    # built and served inside the runner; Playwright drives localhost.
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @pm-operator/web exec playwright install chromium

      - name: Reset and migrate test database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESET_DB_ALLOW_HOST: ${{ vars.RESET_DB_ALLOW_HOST }}
        run: node packages/db/reset-and-migrate.mjs --wipe-auth

      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm --filter @pm-operator/web build

      - name: Run E2E
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @pm-operator/web test:e2e

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
